# Supabase CLI config for Axis Cloud. `project_id` is a local identifier; `supabase link --project-ref
# <ref>` connects this to a hosted project. Regenerate/extend with `supabase init` if your CLI version
# expects newer keys. No secrets here — those live in the dashboard / .env (gitignored).
project_id = "axis-cloud"

[db]
port = 54322
major_version = 15

[auth]
# Email/password to start (works headless from ForgeFX). Turn confirmations on once SMTP is configured.
enable_signup = true
# Confirmation emails redirect to the Site URL by default; keep it the STABLE public web domain so the
# link never points at localhost / the desktop app's random port. The app passes an explicit
# emailRedirectTo (see ForgeFX runtime/cloud.ts) which MUST appear in additional_redirect_urls below, or
# Supabase silently falls back to site_url. Auth is headless (email/password) so the redirect carries no
# session — the target is just a friendly "confirmed" landing page.
# NOTE: this drives the LOCAL stack only. Set the same values on the hosted project under
# Dashboard → Authentication → URL Configuration (or `supabase config push`).
site_url = "https://axisapp.live"
additional_redirect_urls = [
  "https://axisapp.live/auth/confirmed",
  "http://localhost:5173/auth/confirmed"  # local dev (set AXIS_AUTH_CONFIRM_URL to match)
]
# Anonymous sign-ins: editor-cache uploads (functions/editor-caches) accept a per-install Supabase ANONYMOUS
# session as the uploader identity (no e-mail, no CAPTCHA). This switch is PROJECT-WIDE — an anonymous user gets a
# normal `authenticated` JWT with `is_anonymous: true` — so account-only features refuse such sessions explicitly
# (migration …_anonymous_session_hardening.sql; device-profiles and diagnostic-captures check it in code).
# Hosted project: apply the migrations FIRST, then enable it under Dashboard → Authentication → Sign In / Providers.
enable_anonymous_sign_ins = true

[auth.rate_limit]
# Anonymous sign-ins per hour per IP address (the Supabase default, pinned here so it is a reviewed value). The
# editor-caches function limits uploads per network on top of this.
anonymous_users = 30

[auth.email]
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
# Preset .syx blobs (brotli-compressed by ForgeFX). Raise if you store large full-device backups.
file_size_limit = "50MiB"

[functions.delete-account]
# GDPR Art. 17 account erasure. JWT-gated: the caller is identified from their own token,
# so a user can only delete themselves. Runs with the service role (server-side only).
verify_jwt = true

[functions.gc-blobs]
# Orphan-blob sweep (quota enforcement is metadata-gated; interrupted syncs can leave unreferenced
# blobs). NOT user-facing: gated by the GC_SECRET header, invoked manually or on a schedule — no
# user JWT involved.
verify_jwt = false

[functions.device-profiles]
# Global device-definition profile store (AXISCLOUD-2). GET is public (profiles are shared, non-user
# data), so JWT verification is OFF at the platform layer; the function verifies the caller's token
# MANUALLY on POST (upload) and writes with the service role.
verify_jwt = false

[functions.diagnostic-captures]
# Opt-in diagnostic capture upload (MT; signed-upload flow: reserve + finalize, small JSON requests only).
# JWT verification is OFF at the platform layer on purpose: the handler authenticates the caller itself
# (Auth server getUser, anonymous sessions refused) BEFORE it reads anything, so every auth failure has the
# same `{ "error": "unauthorized" }` body — the platform check answers with its own, differently shaped
# body — and token verification does not depend on the project's JWT-signing mode. Writes use the service
# role.
verify_jwt = false

[functions.editor-caches]
# Editor definitions-cache contributions (MP; signed-upload flow: reserve + finalize + delete, small JSON requests).
# JWT verification is OFF at the platform layer: the status GET (`wanted` yes/no) is public, and every other
# request is authenticated by the handler itself (Auth server getUser) before it reads anything — accounts AND
# anonymous sessions are accepted by design. Writes use the service role. Function secrets (never here):
# EDITOR_CACHE_IP_SALT (required), EDITOR_CACHE_UPLOADS=off (kill switch) — see README "Editor-cache uploads".
verify_jwt = false
